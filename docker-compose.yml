services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: dlh-palu-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./storage:/var/www/storage
      - ./bootstrap/cache:/var/www/bootstrap/cache
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-dlh_palu}
      - DB_USERNAME=${DB_USERNAME:-dlh_user}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - DB_SSLMODE=prefer
      - DB_NEON_ENDPOINT=
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dlh-network

  nginx:
    image: nginx:alpine
    container_name: dlh-palu-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - .:/var/www
      - ./storage:/var/www/storage
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - dlh-network

  db:
    image: postgres:16-alpine
    container_name: dlh-palu-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-dlh_palu}
      POSTGRES_USER: ${DB_USERNAME:-dlh_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-dlh_user} -d ${DB_DATABASE:-dlh_palu}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dlh-network

  queue:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: dlh-palu-queue
    restart: unless-stopped
    working_dir: /var/www
    # --timeout mengikuti DB_QUEUE_RETRY_AFTER (1900) agar job panjang
    # (backup/restore ~30 menit) tidak dibunuh di tengah jalan.
    command: php artisan queue:work --tries=3 --timeout=1900
    volumes:
      - .:/var/www
      - ./storage:/var/www/storage
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-dlh_palu}
      - DB_USERNAME=${DB_USERNAME:-dlh_user}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - DB_SSLMODE=prefer
      - DB_NEON_ENDPOINT=
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dlh-network

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: dlh-palu-scheduler
    restart: unless-stopped
    working_dir: /var/www
    command: >
      sh -c "while true; do php artisan schedule:run --verbose --no-interaction & sleep 60; done"
    volumes:
      - .:/var/www
      - ./storage:/var/www/storage
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-dlh_palu}
      - DB_USERNAME=${DB_USERNAME:-dlh_user}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - DB_SSLMODE=prefer
      - DB_NEON_ENDPOINT=
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dlh-network

volumes:
  db-data:

networks:
  dlh-network:
    driver: bridge
