# Catatan arsitektur:
# - Kode aplikasi + vendor + aset build berasal dari IMAGE (Dockerfile stage
#   "production"), bukan dari bind-mount host. Ini membuat `git clone` baru
#   di VPS langsung jalan tanpa perlu composer install / npm run build di host
#   (vendor/ dan public/build memang gitignored).
# - Yang di-bind dari host hanya: .env, storage/, bootstrap/cache/ — bagian
#   yang berubah saat runtime.
# - Deploy = git pull && docker compose up -d --build && migrate.

x-app-volumes: &app-volumes
  - ./.env:/var/www/.env
  - ./storage:/var/www/storage
  - ./bootstrap/cache:/var/www/bootstrap/cache

x-app-env: &app-env
  APP_ENV: ${APP_ENV:-production}
  APP_DEBUG: ${APP_DEBUG:-false}

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: dlh-palu-app
    restart: unless-stopped
    working_dir: /var/www
    volumes: *app-volumes
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dlh-network

  nginx:
    image: nginx:alpine
    container_name: dlh-palu-nginx
    restart: unless-stopped
    # Hanya port 80. Untuk HTTPS, pasang reverse proxy (Caddy/Traefik/Certbot)
    # di depan container ini — lihat README §12.
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    # Ambil kode + aset publik (public/build, dsb.) dari image app.
    volumes_from:
      - app:ro
    depends_on:
      - app
    networks:
      - dlh-network

  db:
    image: postgres:16-alpine
    container_name: dlh-palu-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-dlh_palu}
      POSTGRES_USER: ${DB_USERNAME:-dlh_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-dlh_user} -d ${DB_DATABASE:-dlh_palu}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dlh-network

  queue:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: dlh-palu-queue
    restart: unless-stopped
    working_dir: /var/www
    # --timeout mengikuti DB_QUEUE_RETRY_AFTER (1900) agar job panjang
    # (backup/restore ~30 menit) tidak dibunuh di tengah jalan.
    command: php artisan queue:work --tries=3 --timeout=1900
    volumes: *app-volumes
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dlh-network

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: dlh-palu-scheduler
    restart: unless-stopped
    working_dir: /var/www
    command: >
      sh -c "while true; do php artisan schedule:run --verbose --no-interaction & sleep 60; done"
    volumes: *app-volumes
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dlh-network

volumes:
  db-data:

networks:
  dlh-network:
    driver: bridge
