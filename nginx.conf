server {
    listen 80;
    server_name localhost;
    root /var/www/public;

    # Sembunyikan versi nginx di header Server dan halaman error (Temuan #5)
    server_tokens off;

    # ── Kompresi GZIP — wajib agar CSS/JS/HTML dikirim terkompresi (Performance) ──
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";

    index index.php;

    charset utf-8;

    # Batas ukuran body request — disamakan dengan batas upload aplikasi:
    # restore backup maks 500MB (BackupController), file GIS 50MB, dokumen 5MB.
    # Harus >= upload_max_filesize PHP (lihat Dockerfile, uploads.ini).
    client_max_body_size 512M;

    # Sitemap dinamis via Laravel (SitemapController) harus prioritas meski public/sitemap.xml ada sebagai file fisik fallback.
    # Tanpa ini, try_files $uri akan serve file statis dan artikel baru tidak masuk sitemap.
    location = /sitemap.xml {
        try_files /index.php?$query_string =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
