<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>SILINGKAR DLH ADMIN</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  /* Desain sama dengan splash web (resources/views/components/splash.blade.php). */
  #silingkar-splash {
    position: fixed; inset: 0; z-index: 100000;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 30% 25%, #065f46 0%, #064e3b 45%, #082f40 100%);
    overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif;
  }
  .sk-pre__glow {
    position: absolute; width: 520px; height: 520px; border-radius: 9999px;
    background: radial-gradient(circle, rgba(45,212,191,.35), transparent 60%);
    filter: blur(40px); animation: sk-glow 3s ease-in-out infinite;
  }
  .sk-pre__inner {
    position: relative; display: flex; flex-direction: column;
    align-items: center; text-align: center; padding: 1rem;
  }
  .sk-pre__badge {
    position: relative; display: flex; align-items: center; justify-content: center;
    width: 156px; height: 156px; margin-bottom: 1.5rem;
  }
  .sk-pre__ring {
    position: absolute; inset: 0; border-radius: 9999px;
    border: 3px solid rgba(255,255,255,.10); border-top-color: #6ee7b7; border-right-color: #28c6e8;
    animation: sk-spin 1s linear infinite;
  }
  .sk-pre__ring2 {
    position: absolute; inset: 10px; border-radius: 9999px;
    border: 2px solid rgba(255,255,255,.08); border-bottom-color: #34d399;
    animation: sk-spin 1.6s linear infinite reverse;
  }
  .sk-pre__logo {
    width: 120px; height: 120px; object-fit: contain;
    filter: drop-shadow(0 10px 24px rgba(0,0,0,.4));
    animation: sk-pop .7s cubic-bezier(.16,1,.3,1) both, sk-float 3s ease-in-out .7s infinite;
  }
  .sk-pre__title {
    color: #fff; font-weight: 800; letter-spacing: .12em; text-transform: uppercase;
    font-size: .95rem; opacity: 0; animation: sk-rise .6s ease .25s forwards;
  }
  .sk-pre__subtitle {
    color: #6ee7b7; font-weight: 700; letter-spacing: .28em; text-transform: uppercase;
    font-size: .72rem; margin-top: .25rem; opacity: 0; animation: sk-rise .6s ease .38s forwards;
  }
  .sk-pre__bar {
    width: 200px; height: 4px; border-radius: 9999px;
    background: rgba(255,255,255,.14); overflow: hidden; margin-top: 1.5rem;
  }
  .sk-pre__bar span {
    display: block; height: 100%; width: 0%; border-radius: 9999px;
    background: linear-gradient(90deg, #6ee7b7, #28c6e8); transition: width .2s linear;
  }
  .sk-pre__hint {
    color: rgba(255,255,255,.6); font-size: .72rem; margin-top: 1rem;
    opacity: 0; animation: sk-rise .6s ease .5s forwards;
  }
  @keyframes sk-spin { to { transform: rotate(360deg); } }
  @keyframes sk-pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes sk-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  @keyframes sk-rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes sk-glow { 0%, 100% { opacity: .7; transform: scale(1); } 50% { opacity: 1; transform: scale(1.1); } }
  @media (prefers-reduced-motion: reduce) {
    .sk-pre__ring, .sk-pre__ring2, .sk-pre__logo, .sk-pre__glow { animation: none; }
    .sk-pre__title, .sk-pre__subtitle, .sk-pre__hint { animation: none; opacity: 1; }
  }
</style>
</head>
<body>
<div id="silingkar-splash" role="status" aria-live="polite" aria-label="Memuat SILINGKAR DLH Kota Palu">
  <div class="sk-pre__glow" aria-hidden="true"></div>
  <div class="sk-pre__inner">
    <div class="sk-pre__badge">
      <span class="sk-pre__ring" aria-hidden="true"></span>
      <span class="sk-pre__ring2" aria-hidden="true"></span>
      <img src="logo.webp" alt="" width="120" height="120" class="sk-pre__logo">
    </div>
    <p class="sk-pre__title">Dinas Lingkungan Hidup</p>
    <p class="sk-pre__subtitle">Kota Palu</p>
    <div class="sk-pre__bar" aria-hidden="true"><span id="sk-pre-fill"></span></div>
    <p class="sk-pre__hint">Menyiapkan layanan untuk Anda...</p>
  </div>
</div>
<script>
  // Progress bar berjalan terus sampai Rust memindahkan halaman.
  (function () {
    var fill = document.getElementById('sk-pre-fill');
    var start = Date.now();
    (function tick() {
      // Naik sampai 90% lalu diam — sisa menunggu keputusan koneksi.
      var p = Math.min((Date.now() - start) / 3000, 1) * 0.9;
      if (fill) fill.style.width = (p * 100) + '%';
      requestAnimationFrame(tick);
    })();
  })();
  window.addEventListener('DOMContentLoaded', function () {
    var t = window.__TAURI__;
    var going = false;
    function boot() {
      if (going || !(t && t.core && t.core.invoke)) return;
      t.core.invoke('check_connection').then(function (status) {
        if (going) return;
        if (status === 'online') {
          // Navigasi lewat WebView sendiri — andal, tidak seperti win.navigate().
          return t.core.invoke('admin_target').then(function (target) {
            going = true;
            location.href = target;
          });
        }
        going = true;
        location.href = '/error.html';
      }).catch(function () {});
    }
    // Invoke pertama + watchdog: bila IPC mati/tergantung, dicoba ulang senyap.
    boot();
    setInterval(boot, 12000);
  });
</script>
</body>
</html>
